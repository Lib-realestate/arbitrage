<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デルタサーチ | フリマ→Amazon 価格差分析</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1a1f2a;
    --panel2: #222836;
    --line: #2e3648;
    --text: #dfe4ee;
    --sub: #8b93a7;
    --accent: #4fc3f7;
    --plus: #55d68a;
    --minus: #f2707a;
    --mercari: #e5544b;
    --amazon: #f0a13c;
    --mono: "Consolas", "SF Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 14px; padding: 18px; max-width: 1200px; margin: 0 auto;
  }
  h1 { font-size: 18px; letter-spacing: .08em; margin-bottom: 2px; }
  h1 .delta { color: var(--accent); font-family: var(--mono); }
  .tagline { color: var(--sub); font-size: 12px; margin-bottom: 16px; }

  .searchbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .searchbar input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 15px;
  }
  .searchbar input:focus { outline: 1px solid var(--accent); }
  button.primary {
    background: var(--accent); color: #0a121a; border: none; font-weight: 700;
    padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 15px;
  }
  button.primary:disabled { opacity: .4; cursor: default; }

  .options { display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 14px; font-size: 12.5px; color: var(--sub); }
  .options label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .options input[type=number] { width: 55px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  .options input[type=text] { background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; width: 300px; }

  #status { font-size: 12.5px; color: var(--sub); margin-bottom: 10px; min-height: 18px;
    font-family: var(--mono); }
  #status .err { color: var(--minus); }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  th { background: var(--panel2); color: var(--sub); font-size: 11.5px; text-align: left;
    padding: 8px 10px; cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted { color: var(--accent); }
  th .arrow { font-size: 9px; }
  td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: #202636; }
  td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  .mpn { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 13px; }
  .cnt { color: var(--sub); font-size: 11px; }
  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 4px;
    background: #000; display: block; }
  .ttl { font-size: 12px; line-height: 1.45; max-width: 280px; }
  .ttl a { color: var(--text); text-decoration: none; }
  .ttl a:hover { color: var(--accent); text-decoration: underline; }
  .src { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 3px;
    padding: 1px 6px; color: #fff; margin-bottom: 3px; }
  .src.m { background: var(--mercari); }
  .src.a { background: var(--amazon); }
  .plus { color: var(--plus); font-weight: 700; }
  .minus { color: var(--minus); }
  .na { color: var(--sub); }
  .foot { color: var(--sub); font-size: 11.5px; margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>

<h1><span class="delta">Δ</span> デルタサーチ</h1>
<div class="tagline">メルカリ仕入れ → Amazon販売の価格差を型番マッチングで検出</div>

<div class="searchbar">
  <input type="text" id="kw" placeholder='キーワード（例: WF-1000XM5 / Panasonic バッテリー）' onkeydown="if(event.key==='Enter')run()">
  <button class="primary" id="runBtn" onclick="run()">分析開始</button>
</div>

<div class="options">
  <label>取得件数 <input type="number" id="limit" value="60" min="10" max="120"></label>
  <label>Amazon逆引き上限 <input type="number" id="maxMpn" value="10" min="1" max="20"></label>
  <label>販売手数料 <input type="number" id="feePct" value="10" min="0" max="30">%</label>
  <label>送料概算 <input type="number" id="shipCost" value="800" min="0" step="100">円</label>
  <label style="flex:1">NGワード <input type="text" id="ngWords" style="width:100%"></label>
</div>

<div class="options">
  <label>出品価格 = Amazon価格 × <input type="number" id="priceRate" value="1.00" step="0.01" min="0.5" max="2"></label>
  <label>リードタイム <input type="number" id="leadTime" value="7" min="1" max="30">日</label>
  <label>配送パターン <input type="text" id="shipGroup" value="DEFAULT" style="width:110px"></label>
  <label><input type="checkbox" id="allowNew" checked> 新品未使用を新品として出す</label>
  <button class="primary" onclick="exportCsv()" style="padding:6px 16px;font-size:13px">出品ファイルを出力</button>
  <button onclick="toggleTpl()" style="background:var(--panel2);color:var(--sub);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer">説明文の設定</button>
</div>
<div id="tplBox" style="display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:14px">
  <div style="color:var(--sub);font-size:12px;margin-bottom:6px">
    コンディション説明の定型文（使える差し込み： {型番} {状態} {タイトル}）
  </div>
  <textarea id="noteTpl" style="width:100%;height:70px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px"></textarea>
</div>

<div id="status">キーワードを入力して分析開始</div>
<div id="result"></div>
<div class="foot">
  メルカリ最安の状態（新品未使用→Amazon新品、それ以外→Amazon中古）に合わせて比較。カート価格が無い場合は最安出品価格。<br>
  比率 = メルカリ最安 ÷ Amazon価格（低いほど旨い）。想定利益 = Amazon価格 ×(1−手数料) − 送料 − メルカリ最安。<br>
  最終判断は必ず両リンク先で現物確認（状態・付属品・同一商品か）。
</div>

<script>
const WORKER = "https://arbitrage-ai.elle-71-boc.workers.dev";
const DEFAULT_NG = "片耳,右耳,左耳,右のみ,左のみ,ケースのみ,充電ケース,イヤーピース,付属品,ジャンク,部品取り,訳あり,訳アリ,箱のみ,ケーブル,カバー,保護,フィルム,互換";

const $ = id => document.getElementById(id);
$("ngWords").value = localStorage.getItem("ds_ng") || DEFAULT_NG;
$("ngWords").addEventListener("change", () => localStorage.setItem("ds_ng", $("ngWords").value));

let rows = [];
let sortKey = "profit", sortDir = -1;

// ===== 出品ファイル出力 =====
const selected = new Set();
const noteEdits = {};   // 型番ごとの個別編集した説明文

const DEFAULT_NOTE = `- 型番 {型番}
- 商品の状態 {状態}
画像の物が全てです。付属品などは事前にご確認ください。`;

$("noteTpl").value = localStorage.getItem("ds_note") || DEFAULT_NOTE;
$("noteTpl").addEventListener("change", () => { localStorage.setItem("ds_note", $("noteTpl").value); render(); });

function toggleTpl() {
  const b = $("tplBox");
  b.style.display = b.style.display === "none" ? "block" : "none";
}
function toggleSel(mpn, on) { on ? selected.add(mpn) : selected.delete(mpn); render(); }
function editNote(mpn, val) { noteEdits[mpn] = val; }

// メルカリの状態 → Amazonのコンディション
const COND_MAP = {
  1: "New", 2: "UsedLikeNew", 3: "UsedVeryGood", 4: "UsedGood", 5: "UsedAcceptable",
};
function amzCondition(item) {
  const c = item.condition;
  if (c === 6) return null;                       // 状態が悪いものは出品しない
  if (c === 1 && (/開封/.test(item.title) || !$("allowNew").checked)) return "UsedLikeNew";
  return COND_MAP[c] || "UsedAcceptable";
}
function mercariId(url) {
  const m = String(url).match(/\/item\/(m\d+)/);
  return m ? m[1] : "";
}
function buildNote(r) {
  if (noteEdits[r.mpn] != null) return noteEdits[r.mpn];
  return $("noteTpl").value
    .replace(/\{型番\}/g, r.mpn)
    .replace(/\{状態\}/g, condName(r.mItem.condition))
    .replace(/\{タイトル\}/g, r.mItem.title);
}

const TPL_LINE1 = "TemplateType=Offer\tVersion=2020.000";
const TPL_JP = "商品管理番号\t販売価格\tポイントパーセント\t在庫数\t商品コード(JANコード等)\t商品コードのタイプ\t商品のコンディション\t商品のコンディション説明\t対象ASIN\t商品名\t更新タイプ\tセール価格\tセールポイントパーセント\tセール開始日\tセール終了日\tリードタイム(出荷までにかかる日数)\t商品の公開日\tギフト\tギフトメッセージ\tフルフィルメントセンターID\t使用しない支払方法\t出品者SKUのメイン画像URL\t出品者SKUのサブ画像URL1\t出品者SKUのサブ画像URL2\t出品者SKUのサブ画像URL3\t出品者SKUのサブ画像URL4\t出品者SKUのサブ画像URL5\t配送パターン\t商品タックスコード\t電池の有無\t電池付属\tバッテリーセルタイプ\t電池のタイプ\tフル電池数\t電池の重量(グラム)\tリチウムイオン電池単数\tリチウムメタル電池単数\tリチウム電池パッケージ\tリチウム電池エネルギー含有量\tリチウム電池重量\t危険物1\t危険物2\t危険物3\t危険物4\t危険物5\t国連(UN)番号\t安全データシート(SDS) URL\t商品の重量\t商品の容量\t引火点(°C)\t危険物ラベル1\t危険物ラベル2\t危険物ラベル3\t商品の重量の単位\t商品の容量の単位\tリチウム電池のエネルギー量測定単位\tリチウム電池の重量の測定単位\t電池の重量の測定単位";
const TPL_EN = ["sku","price","standard-price-points-percent","quantity","product-id","product-id-type","condition-type","condition-note","ASIN-hint","title","operation-type","sale-price","sale-price-points-percent","sale-start-date","sale-end-date","leadtime-to-ship","launch-date","is-giftwrap-available","is-gift-message-available","fulfillment-center-id","optional-payment-type-exclusion","main-offer-image","offer-image1","offer-image2","offer-image3","offer-image4","offer-image5","merchant_shipping_group_name","product-tax-code","batteries_required","are_batteries_included","battery_cell_composition","battery_type","number_of_batteries","battery_weight","number_of_lithium_ion_cells","number_of_lithium_metal_cells","lithium_battery_packaging","lithium_battery_energy_content","lithium_battery_weight","supplier_declared_dg_hz_regulation1","supplier_declared_dg_hz_regulation2","supplier_declared_dg_hz_regulation3","supplier_declared_dg_hz_regulation4","supplier_declared_dg_hz_regulation5","hazmat_united_nations_regulatory_id","safety_data_sheet_url","item_weight","item_volume","flash_point","ghs_classification_class1","ghs_classification_class2","ghs_classification_class3","item_weight_unit_of_measure","item_volume_unit_of_measure","lithium_battery_energy_content_unit_of_measure","lithium_battery_weight_unit_of_measure","battery_weight_unit_of_measure"];

function exportCsv() {
  let targets = rows.filter(r => selected.has(r.mpn) && r.aItem && r.aPrice != null);
  if (targets.length === 0) {
    alert("出品する商品にチェックを入れてください（Amazon価格が取れていない行は出力できません）");
    return;
  }
  const skipped = targets.filter(r => amzCondition(r.mItem) === null).length;
  targets = targets.filter(r => amzCondition(r.mItem) !== null);
  if (targets.length === 0) { alert("選択された商品はすべて状態不良のため出品できません"); return; }

  const rate = parseFloat($("priceRate").value) || 1;
  const lead = $("leadTime").value;
  const ship = $("shipGroup").value.trim() || "DEFAULT";

  const lines = targets.map(r => {
    const mid = mercariId(r.mItem.url);
    const v = {
      "sku": `m_${mid}-${r.mItem.price}`,
      "price": String(Math.round(r.aPrice * rate)),
      "quantity": "1",
      "product-id": r.aItem.asin,
      "product-id-type": "ASIN",
      "condition-type": amzCondition(r.mItem),
      "condition-note": buildNote(r).replace(/[\t\r\n]+/g, " "),
      "leadtime-to-ship": lead,
      "merchant_shipping_group_name": ship,
      "batteries_required": "FALSE",
      "supplier_declared_dg_hz_regulation1": "not_applicable",
    };
    for (let i = 1; i <= 6; i++) {
      v[i === 1 ? "main-offer-image" : `offer-image${i - 1}`] =
        mid ? `https://static.mercdn.net/item/detail/orig/photos/${mid}_${i}.jpg` : "";
    }
    return TPL_EN.map(k => v[k] ?? "").join("\t");
  });

  const text = [TPL_LINE1, TPL_JP, TPL_EN.join("\t"), ...lines].join("\r\n");
  const blob = new Blob(["\uFEFF" + text], { type: "text/tab-separated-values" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mercari_amazon_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  setStatus(`出品ファイルを出力しました（${targets.length}件${skipped ? ` / 状態不良で除外 ${skipped}件` : ""}）`);
}

// ---- 型番抽出 ----
// 全角→半角、大文字化、ハイフン類統一
function normalize(s) {
  return s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
          .replace(/[‐－―ー−]/g, "-")
          .toUpperCase();
}
// 英字1-6 + (ハイフン任意) + 数字2-6 + 英数0-4 のパターンを型番とみなす
function extractMpns(title) {
  const t = normalize(title);
  const re = /[A-Z]{1,6}-?[0-9]{2,6}[A-Z0-9]{0,4}/g;
  const out = new Set();
  let m;
  while ((m = re.exec(t)) !== null) {
    const raw = m[0];
    const key = raw.replace(/-/g, "");     // グルーピングキーはハイフン無視
    if (key.length < 5) continue;          // 短すぎるものは除外 (例: V6, S型)
    out.add(key);
  }
  return [...out];
}

function ngHit(title, ngs) {
  return ngs.some(w => w && title.includes(w));
}

async function run() {
  const kw = $("kw").value.trim();
  if (!kw) return;
  $("runBtn").disabled = true;
  rows = [];
  render();

  try {
    // 1) メルカリ検索
    setStatus("メルカリ検索中…");
    const mRes = await fetch(`${WORKER}/mercari?q=${encodeURIComponent(kw)}&status=on_sale&limit=${$("limit").value}`);
    const mData = await mRes.json();
    if (mData.error) throw new Error("メルカリ: " + mData.error);

    const ngs = $("ngWords").value.split(",").map(s => s.trim()).filter(Boolean);
    const items = mData.items.filter(it => !ngHit(it.title, ngs));
    setStatus(`メルカリ ${mData.count}件取得（NG除外後 ${items.length}件）→ 型番抽出中…`);

    // 2) 型番グルーピング
    const groups = {};
    for (const it of items) {
      for (const mpn of extractMpns(it.title)) {
        (groups[mpn] = groups[mpn] || []).push(it);
      }
    }
    const mpns = Object.entries(groups)
      .sort((a, b) => b[1].length - a[1].length)
      .slice(0, parseInt($("maxMpn").value));
    if (mpns.length === 0) throw new Error("型番を抽出できませんでした。キーワードを具体的にしてください。");

    // 3) 型番ごとにAmazon逆引き（順次・SP-APIレート配慮）
    let done = 0;
    for (const [mpn, gItems] of mpns) {
      done++;
      setStatus(`Amazon逆引き中… ${done}/${mpns.length}（${mpn}）`);
      try {
        const aRes = await fetch(`${WORKER}/amazon?q=${encodeURIComponent(mpn)}&limit=5`);
        const aData = await aRes.json();
        if (aData.error) throw new Error(aData.error);

        // タイトル or MPN欄に型番を含むものを優先、無ければ先頭
        const norm = s => normalize(s || "").replace(/-/g, "");
        let best = aData.items.find(a => norm(a.title).includes(mpn) || norm(a.mpn).includes(mpn))
                 || aData.items[0];

        const cheapest = gItems.reduce((a, b) => a.price <= b.price ? a : b);
        const isNew = cheapest.condition == null || cheapest.condition === 1; // 1のみ新品扱い
        let aPrice = best ? (isNew ? best.priceNew : best.priceUsed) : null;
        // カート価格が無ければ最安出品価格を取得
        if (best && aPrice == null) {
          try {
            const oRes = await fetch(`${WORKER}/offers?asin=${best.asin}&condition=${isNew ? "New" : "Used"}`);
            const oData = await oRes.json();
            aPrice = oData.lowest ?? null;
          } catch (_) {}
        }
        addRow(mpn, gItems.length, cheapest, best || null, aPrice, isNew, null);
      } catch (e) {
        const cheapest = gItems.reduce((a, b) => a.price <= b.price ? a : b);
        addRow(mpn, gItems.length, cheapest, null, null, true, String(e.message).slice(0, 120));
      }
      render();
      await new Promise(r => setTimeout(r, 600));
    }
    setStatus(`完了：${rows.length}型番を分析（メルカリ${items.length}件から）`);
  } catch (e) {
    setStatus(`<span class="err">エラー: ${e.message}</span>`);
  } finally {
    $("runBtn").disabled = false;
  }
}

function addRow(mpn, count, mItem, aItem, aPrice, isNew, err) {
  const fee = parseFloat($("feePct").value) / 100;
  const ship = parseFloat($("shipCost").value);
  const diff = aPrice != null ? aPrice - mItem.price : null;
  const ratio = aPrice ? mItem.price / aPrice : null;
  const profit = aPrice != null ? Math.round(aPrice * (1 - fee) - ship - mItem.price) : null;
  rows.push({ mpn, count, mItem, aItem, aPrice, isNew, diff, ratio, profit, err });
}

const COND_NAMES = { 1:"新品未使用", 2:"未使用に近い", 3:"目立った傷なし", 4:"やや傷汚れ", 5:"傷汚れあり", 6:"状態悪い" };
function condName(c) { return COND_NAMES[c] || ""; }

function setStatus(html) { $("status").innerHTML = html; }

function fmt(n) { return n == null ? '<span class="na">—</span>' : "¥" + n.toLocaleString(); }

function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
  render();
}

function render() {
  if (rows.length === 0) { $("result").innerHTML = ""; return; }
  const sorted = [...rows].sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va - vb) * sortDir;
  });
  const arrow = k => sortKey === k ? `<span class="arrow">${sortDir === -1 ? "▼" : "▲"}</span>` : "";
  const th = (k, label) => `<th class="${sortKey===k?'sorted':''}" onclick="sortBy('${k}')">${label} ${arrow(k)}</th>`;

  let html = `<table><thead><tr>
    <th style="width:30px"></th><th>型番</th><th></th><th>メルカリ最安</th>
    ${th("aPrice","Amazon価格")}<th></th><th>Amazon商品</th>
    ${th("diff","差額")}${th("ratio","比率")}${th("profit","想定利益")}
  </tr></thead><tbody>`;

  for (const r of sorted) {
    const m = r.mItem, a = r.aItem;
    html += `<tr>
      <td><input type="checkbox" ${selected.has(r.mpn) ? "checked" : ""} onchange="toggleSel('${r.mpn}', this.checked)"></td>
      <td><span class="mpn">${r.mpn}</span><br><span class="cnt">${r.count}件</span></td>
      <td>${m.image ? `<a href="${m.url}" target="_blank"><img class="thumb" src="${m.image}"></a>` : ""}</td>
      <td class="ttl"><span class="src m">メルカリ</span><br>
        <a href="${m.url}" target="_blank">${m.title}</a><br>
        <b style="font-family:var(--mono)">¥${m.price.toLocaleString()}</b>
        <span class="cnt">${condName(m.condition)}</span></td>
      <td class="num">${fmt(r.aPrice)}${r.aPrice != null ? `<br><span class="cnt">${r.isNew ? "新品" : "中古"}</span>` : ""}</td>
      <td>${a?.image ? `<a href="${a.url}" target="_blank"><img class="thumb" src="${a.image}"></a>` : ""}</td>
      <td class="ttl">${a
        ? `<span class="src a">Amazon</span><br><a href="${a.url}" target="_blank">${a.title.slice(0,80)}…</a>`
        : `<span class="na">${r.err || "該当なし"}</span>`}</td>
      <td class="num ${r.diff > 0 ? "plus" : "minus"}">${r.diff != null ? (r.diff>0?"+":"") + "¥" + r.diff.toLocaleString() : '<span class="na">—</span>'}</td>
      <td class="num">${r.ratio != null ? Math.round(r.ratio * 100) + "%" : '<span class="na">—</span>'}</td>
      <td class="num ${r.profit > 0 ? "plus" : "minus"}">${r.profit != null ? (r.profit>0?"+":"") + "¥" + r.profit.toLocaleString() : '<span class="na">—</span>'}</td>
        </tr>`;
    if (selected.has(r.mpn) && amzCondition(r.mItem)) {
      html += `<tr><td></td><td colspan="8" style="padding-top:0">
        <div style="color:var(--sub);font-size:11px;margin-bottom:3px">コンディション説明（この商品だけ編集できます）</div>
        <textarea onchange="editNote('${r.mpn}', this.value)"
          style="width:100%;height:54px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:6px;font-size:11.5px">${buildNote(r)}</textarea>
      </td></tr>`;
    }
  }
  html += "</tbody></table>";
  $("result").innerHTML = html;
}
</script>
</body>
</html>
